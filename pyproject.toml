[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teamcj-sourcing-engine"
version = "1.0.0"
description = "MAIN Summit 2026 - HTGF Track: Early-Stage European VC Startup Sourcing Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tldextract>=5.1.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
