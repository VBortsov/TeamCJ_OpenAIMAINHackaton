<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&amp;display=swap');
      
      .font-serif { font-family: 'Newsreader', Georgia, serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      .shadow-card {
        filter: drop-shadow(0 1px 2px rgba(70, 40, 20, 0.12)) drop-shadow(0 8px 16px rgba(60, 35, 15, 0.08));
      }
      .shadow-hero {
        filter: drop-shadow(0 2px 4px rgba(70, 40, 20, 0.15)) drop-shadow(0 12px 24px rgba(60, 35, 15, 0.1));
      }
    </style>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#252823" />
    </marker>
    <marker id="arrowTerra" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#A44735" />
    </marker>

    <!-- Filters & Gradients -->
    <radialGradient id="vignette" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E4D2C3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BCA898" stop-opacity="0.6" />
    </radialGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2DC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFF8EE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFF2DC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Desk Surface Background -->
  <rect width="1600" height="900" fill="#E4D2C3" />
  <rect width="1600" height="900" fill="url(#vignette)" />

  <!-- Soft diagonal window light beams -->
  <g transform="rotate(-22 800 450)" opacity="0.7">
    <rect x="-200" y="100" width="2000" height="180" fill="url(#beamGrad)" />
    <rect x="-200" y="380" width="2000" height="220" fill="url(#beamGrad)" />
  </g>

  <!-- ==================== HEADER ==================== -->
  <g class="font-sans">
    <text x="64" y="68" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A44735">HOW FOUNDERHUNT WORKS</text>
  </g>
  <g class="font-serif">
    <text x="64" y="118" font-size="44" font-weight="500" fill="#252823" letter-spacing="-0.5">
      From early public trace to <tspan fill="#A44735">partner shortlist.</tspan>
    </text>
  </g>
  
  <!-- Daily Automated Sourcing Pill -->
  <g class="font-sans" transform="translate(1260, 80)">
    <rect width="276" height="42" rx="21" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#A44735" />
    <text x="40" y="26" font-size="14" font-weight="600" fill="#252823">Daily automated sourcing</text>
  </g>

  <!-- ==================== TIER 1: TOP ROW ==================== -->

  <!-- CARD 01: European Signal Feeds -->
  <g class="shadow-card" transform="translate(64, 155)">
    <rect width="436" height="260" rx="8" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2" />
    <text class="font-sans" x="24" y="32" font-size="11.5" font-weight="700" letter-spacing="1" fill="#A44735">01 · PUBLIC SOURCES</text>
    <text class="font-serif" x="24" y="66" font-size="24" font-weight="600" fill="#252823">European Signal Feeds</text>
    
    <!-- 2x3 Grid of Pills -->
    <g class="font-sans" font-size="13.5" font-weight="500" fill="#252823" text-anchor="middle">
      <!-- Col 1 -->
      <rect x="24" y="90" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="117" y="114">University Spin-offs</text>
      
      <rect x="24" y="140" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="117" y="164">Scientific Papers</text>
      
      <rect x="24" y="190" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="117" y="214">Demo Days &amp; Events</text>

      <!-- Col 2 -->
      <rect x="226" y="90" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="319" y="114">Research Grants</text>
      
      <rect x="226" y="140" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="319" y="164">Open Code &amp; AI</text>
      
      <rect x="226" y="190" width="186" height="38" rx="6" fill="#F7F3EB" stroke="#B8AFA2" stroke-width="1.2" stroke-dasharray="4 3" />
      <text x="319" y="214">+ Modular Sources</text>
    </g>
  </g>

  <!-- Arrow 01 -> 02 -->
  <line x1="500" y1="285" x2="538" y2="285" stroke="#252823" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- CARD 02: Founder-First Graph -->
  <g class="shadow-card" transform="translate(540, 155)">
    <rect width="416" height="260" rx="8" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2" />
    <text class="font-sans" x="24" y="32" font-size="11.5" font-weight="700" letter-spacing="1" fill="#A44735">02 · ENTITY RESOLUTION</text>
    <text class="font-serif" x="24" y="66" font-size="24" font-weight="600" fill="#252823">Founder-First Graph</text>
    
    <!-- 3 Bars -->
    <g class="font-sans" font-size="13.5" font-weight="600" fill="#252823">
      <rect x="24" y="90" width="368" height="38" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="40" y="114">Merge signals &amp; deduplicate by domain</text>

      <rect x="24" y="140" width="368" height="38" rx="6" fill="#DCE3D5" stroke="#C8D4C0" stroke-width="1" />
      <text x="40" y="164">Match German Impressum &amp; HRB filings</text>

      <rect x="24" y="190" width="368" height="38" rx="6" fill="#EAD8CB" stroke="#DEC8B8" stroke-width="1" />
      <text x="40" y="214">Link verified LinkedIn &amp; GitHub profiles</text>
    </g>
  </g>

  <!-- Arrow 02 -> 03 -->
  <line x1="956" y1="285" x2="994" y2="285" stroke="#252823" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- CARD 03: Noise Cleared Automatically -->
  <g class="shadow-card" transform="translate(996, 155)">
    <rect width="540" height="260" rx="8" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 532 0 Q 540 0 540 8 L 540 8 L 0 8 Z" fill="#A44735" />
    
    <text class="font-sans" x="24" y="36" font-size="11.5" font-weight="700" letter-spacing="1" fill="#A44735">03 · SCREENING GATES</text>
    <text class="font-serif" x="24" y="70" font-size="24" font-weight="600" fill="#252823">Noise Cleared Automatically</text>
    
    <!-- 5 Chips -->
    <g class="font-sans" font-size="13" font-weight="500" fill="#252823" text-anchor="middle">
      <!-- Row 1 -->
      <rect x="24" y="94" width="152" height="34" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="100" y="116">Meetups &amp; Clubs</text>

      <rect x="188" y="94" width="152" height="34" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="264" y="116">Dev Agencies</text>

      <rect x="352" y="94" width="164" height="34" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="434" y="116">Age &gt; 3 Years</text>

      <!-- Row 2 -->
      <rect x="24" y="140" width="240" height="34" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="144" y="162">Fake GitHub Stars</text>

      <rect x="276" y="140" width="240" height="34" rx="6" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1" />
      <text x="396" y="162">Already Funded</text>
    </g>

    <!-- Bottom Outcomes -->
    <g class="font-sans" font-size="13" font-weight="600">
      <rect x="24" y="194" width="240" height="38" rx="19" fill="#DCE3D5" stroke="#C8D4C0" stroke-width="1" />
      <text x="144" y="218" text-anchor="middle" fill="#2E5A27">Clean Pre-Seed Ventures ↓</text>

      <rect x="276" y="194" width="240" height="38" rx="19" fill="#EAD8CB" stroke="#A44735" stroke-width="1.5" />
      <text x="396" y="218" text-anchor="middle" fill="#8A3322">Rejected Audit Log</text>
    </g>
  </g>

  <!-- ==================== STEPPED ELBOW CONNECTOR ==================== -->
  <path d="M 1140 415 L 1140 460 L 500 460 L 500 488" fill="none" stroke="#252823" stroke-width="2.5" marker-end="url(#arrow)" />
  
  <!-- Connector Pill -->
  <g class="font-sans" transform="translate(680, 443)">
    <rect width="280" height="34" rx="17" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1.2" />
    <text x="140" y="22" font-size="12.5" font-weight="600" fill="#252823" text-anchor="middle">Only verified early-stage leads</text>
  </g>

  <!-- ==================== TIER 2: BOTTOM ROW (HERO FOCUS) ==================== -->

  <!-- CARD 04: Two-Layer Ranking Engine -->
  <g class="shadow-hero" transform="translate(64, 492)">
    <rect width="892" height="320" rx="8" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2" />
    <text class="font-sans" x="28" y="32" font-size="11.5" font-weight="700" letter-spacing="1" fill="#A44735">04 · TWO-LAYER RANKING ENGINE</text>
    <text class="font-serif" x="28" y="68" font-size="27" font-weight="600" fill="#252823">Thesis Fit + Empirical Cohort Model</text>
    <text class="font-sans" x="864" y="68" font-size="13" font-weight="500" fill="#5B6055" text-anchor="end">Transparent triage · Not a black box</text>

    <!-- Left Panel: 50% HTGF Mandate Fit -->
    <g transform="translate(28, 92)">
      <rect width="380" height="200" rx="6" fill="#DCE3D5" stroke="#C8D4C0" stroke-width="1" />
      <text class="font-sans" x="22" y="32" font-size="16" font-weight="700" fill="#1E3A1A">50% · HTGF Mandate Fit</text>
      <g class="font-sans" font-size="13.5" font-weight="500" fill="#252823">
        <text x="22" y="68">• DACH geography &amp; sector fit</text>
        <text x="22" y="104">• Verified GmbH / HRB &amp; product</text>
        <text x="22" y="140">• Academic spin-off &amp; tech moat</text>
        <text x="22" y="176">• Pilot fit with HTGF IV LPs</text>
      </g>
    </g>

    <!-- Center Plus Badge -->
    <g transform="translate(426, 172)">
      <circle cx="20" cy="20" r="19" fill="#252823" />
      <text class="font-sans" x="20" y="27" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">+</text>
    </g>

    <!-- Right Panel: 50% Cohort Calibration Model -->
    <g transform="translate(484, 92)">
      <rect width="380" height="200" rx="6" fill="#EAD8CB" stroke="#DEC8B8" stroke-width="1" />
      <text class="font-sans" x="22" y="32" font-size="16" font-weight="700" fill="#5E2B1E">50% · Cohort Calibration Model</text>
      <g class="font-sans" font-size="13.5" font-weight="500" fill="#252823">
        <text x="22" y="68">• L2 logistic model (pre- &amp; post-acc)</text>
        <text x="22" y="104">• 688 European cohorts (2014–24)</text>
        <text x="22" y="140">• 5×5 within-year cross-validation</text>
        <text x="22" y="176">• Explainable per-feature drivers</text>
      </g>
    </g>
  </g>

  <!-- Arrow 04 -> 05 (Terracotta) -->
  <line x1="956" y1="652" x2="1018" y2="652" stroke="#A44735" stroke-width="3" marker-end="url(#arrowTerra)" />

  <!-- CARD 05: Ready for Partner Action -->
  <g class="shadow-hero" transform="translate(1026, 536)">
    <!-- Terracotta Corner Brackets -->
    <path d="M -16 32 L -16 -14 L 32 -14" fill="none" stroke="#A44735" stroke-width="5" />
    <path d="M 478 290 L 526 290 L 526 244" fill="none" stroke="#A44735" stroke-width="5" />

    <rect width="510" height="276" rx="8" fill="#F7F3EB" stroke="#D9D2C7" stroke-width="1.2" />
    <text class="font-sans" x="24" y="32" font-size="11.5" font-weight="700" letter-spacing="1" fill="#A44735">05 · BRIEF &amp; WORKFLOW</text>
    <text class="font-serif" x="24" y="66" font-size="26" font-weight="600" fill="#252823">Ready for Partner Action</text>

    <!-- Sub-card 1: Analyst Brief (White) -->
    <g transform="translate(24, 88)">
      <rect width="462" height="78" rx="6" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1" />
      <text class="font-sans" x="18" y="28" font-size="15" font-weight="700" fill="#252823">Source-Backed Analyst Brief</text>
      <text class="font-sans" x="18" y="52" font-size="12.5" font-weight="500" fill="#5B6055">Top signals with clickable sources, key risks, and HTGF LP pilot angles</text>
    </g>

    <!-- Sub-card 2: 1-Click CRM Handoff (Dark Ink) -->
    <g transform="translate(24, 178)">
      <rect width="462" height="78" rx="6" fill="#252823" stroke="#1C1E1B" stroke-width="1" />
      <text class="font-sans" x="18" y="28" font-size="15" font-weight="700" fill="#FFFFFF">1-Click CRM Handoff via n8n</text>
      <text class="font-sans" x="18" y="52" font-size="12.5" font-weight="400" fill="#C4BDB0">Shortlisted ventures route straight into fund CRM &amp; partner alerts</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g class="font-sans" font-size="12.5" font-weight="500" fill="#5B6055">
    <text x="64" y="866">FounderHunt · Founder-first search for venture capital</text>
    <text x="1536" y="866" text-anchor="end">High-Tech Gründerfonds Track · MAIN 2026</text>
  </g>
</svg>